<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 模拟面试官</title>
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #20201e;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --border: rgba(255, 255, 255, 0.10);
    --border-soft: rgba(255, 255, 255, 0.06);
    --accent: #256abf;
    --accent-light: #3987e5;
    --good: #0ca30c;
    --bad: #d03b3b;
    --font: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    background: #111110;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 34px;
    height: 34px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: linear-gradient(135deg, #3987e5, #6250d6);
    color: #fff;
    font-weight: 800;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; }
  header p { margin: 2px 0 0; font-size: 11px; color: var(--muted); }
  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .roadmap-link {
    display: inline-flex;
    align-items: center;
    min-height: 30px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--ink-2);
    font-size: 12px;
    text-decoration: none;
    white-space: nowrap;
  }
  .roadmap-link:hover { background: rgba(255, 255, 255, 0.05); color: var(--ink); }
  .new-chat {
    min-height: 30px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--ink-2);
    font-size: 12px;
    font-weight: 500;
  }
  .new-chat:hover { background: rgba(255, 255, 255, 0.05); color: var(--ink); }
  .status { font-size: 11px; color: var(--good); white-space: nowrap; }

  main {
    flex: 1;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    padding: 18px 18px 14px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 6px 2px 20px;
    min-height: 280px;
    scroll-behavior: smooth;
  }

  .msg { display: flex; gap: 9px; max-width: 88%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 28px;
    height: 28px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 700;
  }
  .ai .avatar { background: rgba(57, 135, 229, 0.16); color: #6da7ec; }
  .user .avatar { background: #2c2c2a; color: var(--ink-2); }
  .bubble {
    padding: 10px 13px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .ai .bubble {
    background: var(--surface-2);
    border: 1px solid var(--border-soft);
    border-top-left-radius: 4px;
  }
  .user .bubble {
    background: var(--accent);
    color: #fff;
    border-top-right-radius: 4px;
  }
  .typing { color: var(--muted); }

  form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  textarea {
    flex: 1;
    min-height: 52px;
    max-height: 150px;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #121211;
    color: var(--ink);
    font: inherit;
    line-height: 1.6;
    resize: vertical;
    outline: none;
  }
  textarea:focus {
    border-color: rgba(57, 135, 229, 0.6);
    box-shadow: 0 0 0 3px rgba(57, 135, 229, 0.12);
  }
  button {
    flex: none;
    min-height: 52px;
    padding: 0 20px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2a78d6; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  @media (max-width: 640px) {
    header { padding: 12px 14px; flex-wrap: wrap; }
    .header-actions { width: 100%; justify-content: flex-end; margin-left: 0; }
    main { padding: 12px 12px 10px; }
    .msg { max-width: 94%; }
    button { padding: 0 14px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">M</div>
    <div>
      <h1>AI 模拟面试官</h1>
      <p>多轮追问 · 中文界面 · 本地运行</p>
    </div>
    <div class="header-actions">
      <a class="roadmap-link" href="/roadmap">路线图</a>
      <button class="new-chat" id="new-chat" type="button">新对话</button>
      <div class="status" id="status">● 已连接</div>
    </div>
  </header>

  <main>
    <div id="chat">
      <div class="msg ai">
        <div class="avatar">AI</div>
        <div class="bubble">你好，我是你的面试教练。先做个自我介绍吧，重点讲一个你亲手做过的项目，以及你具体负责的部分。</div>
      </div>
    </div>

    <form id="form">
      <textarea id="input" rows="2" placeholder="像真的面试一样回答，不用写得很完美……"></textarea>
      <button id="send" type="submit">发送</button>
    </form>
  </main>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const statusEl = document.getElementById('status');
  const newChat = document.getElementById('new-chat');
  const GREETING = '你好，我是你的面试教练。先做个自我介绍吧，重点讲一个你亲手做过的项目，以及你具体负责的部分。';

  function setStatus(text, ok) {
    statusEl.textContent = '● ' + text;
    statusEl.style.color = ok ? 'var(--good)' : 'var(--bad)';
  }

  function addMessage(role, text) {
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'ai' ? 'AI' : '我';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    wrap.append(avatar, bubble);
    chat.append(wrap);
    chat.scrollTop = chat.scrollHeight;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'msg ai';
    el.id = 'typing';
    el.innerHTML = '<div class="avatar">AI</div><div class="bubble typing">正在思考……</div>';
    chat.append(el);
    chat.scrollTop = chat.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  function showGreeting() {
    chat.innerHTML = '';
    addMessage('ai', GREETING);
  }

  async function loadHistory() {
    try {
      const response = await fetch('/messages');
      if (!response.ok) return;
      const data = await response.json();
      if (data.messages && data.messages.length > 0) {
        chat.innerHTML = '';
        data.messages.forEach((message) => {
          addMessage(message.role === 'user' ? 'user' : 'ai', message.content);
        });
        setStatus('已连接', true);
      }
    } catch (error) {
      // 读取失败就保留默认问候
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();

    const text = input.value.trim();
    if (!text || send.disabled) return;

    addMessage('user', text);
    input.value = '';
    send.disabled = true;
    setStatus('正在等待回复', true);
    showTyping();

    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      const data = await response.json();
      hideTyping();

      if (!response.ok) {
        const detail = typeof data.detail === 'string' ? data.detail : '请求格式不对。';
        addMessage('ai', detail);
        setStatus('请求失败', false);
      } else {
        addMessage('ai', data.reply);
        setStatus('已连接', true);
      }
    } catch (error) {
      hideTyping();
      addMessage('ai', '连不上服务器，请检查后端是否还在运行。');
      setStatus('连接失败', false);
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  newChat.addEventListener('click', async () => {
    if (!confirm('确定开始新对话？当前历史会被清空。')) return;

    try {
      const response = await fetch('/reset', { method: 'POST' });
      if (!response.ok) throw new Error('reset failed');
      showGreeting();
      setStatus('已连接', true);
    } catch (error) {
      addMessage('ai', '清空失败，请稍后再试。');
      setStatus('操作失败', false);
    }
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  loadHistory();
</script>
</body>
</html>
